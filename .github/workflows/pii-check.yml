name: PII Check

on:
  push:
  pull_request:

jobs:
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 検知自己テスト（canary test）: 疑似PIIをスキャナが検知できることを先に実証する。
      # スキャナが壊れている（パターン不一致・CRLF混入等）場合はここで CI が fail する。
      - name: PII scanner self-test (canary)
        run: bash scripts/pii-check.sh --self-test

      # ローカルのpre-commitフックと同一スクリプトを単一の検査ロジックとして使用する。
      # git ls-files を使うため .git 配下や未追跡ファイルは対象外。
      - name: Run PII check (scripts/pii-check.sh)
        run: |
          git ls-files '*.md' '*.py' '*.ts' '*.js' '*.yaml' '*.yml' '*.json' \
            | xargs -r bash scripts/pii-check.sh
          echo "✅ No PII patterns detected."
