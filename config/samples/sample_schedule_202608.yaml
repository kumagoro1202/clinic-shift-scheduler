# =============================================================================
# サンプル月次入力（テスト専用・架空データ）
# -----------------------------------------------------------------------------
# 本ファイルはテスト・動作確認専用のサンプル月次入力である。
# sample_clinic.yaml（スタッフA〜E）と組み合わせて使用する。
# 祝日・臨時休診・日付単位休暇のカレンダー展開（P6-3）を検証するため、
# 通常は診療日となる曜日にカレンダー例外を配置している。
# スキーマの定義は external/input-design.md 5 章を参照。
# =============================================================================

schema_version: 2

target_month: "2026-08"

# カレンダー例外（祝日・臨時休診・臨時の日種別変更）
# 2026-08-11 は火曜（通常 full）・2026-08-14 は金曜（通常 full）
calendar_overrides:
  - { date: "2026-08-11", day_type: closed, reason: "祝日" }
  - { date: "2026-08-14", day_type: closed, reason: "夏季休診" }

# 当月の休暇登録（日付単位。FR-02: 終日・午前休・午後休）
vacations:
  - { staff: "スタッフA", date: "2026-08-05", kind: full, paid: true }
  - { staff: "スタッフB", date: "2026-08-20", kind: am, paid: false }
